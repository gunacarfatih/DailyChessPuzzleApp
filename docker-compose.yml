services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: dailychess
      POSTGRES_USER: dailychess
      POSTGRES_PASSWORD: dailychess-local
    ports:
      - "5432:5432"
    volumes:
      - dailychess-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dailychess -d dailychess"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - dailychess-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  dailychess-postgres:
  dailychess-redis:
