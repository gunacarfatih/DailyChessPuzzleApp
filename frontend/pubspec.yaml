name: daily_chess_puzzle
description: "Checkrix - Think. Solve. Master."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  dio: ^5.11.1
  shared_preferences: ^2.5.6
  uuid: ^4.6.0
  chessground: ^11.1.0
  dartchess: ^0.15.0
  flutter_secure_storage: ^11.2.0
  google_sign_in: ^7.2.0
  geolocator: ^14.1.2
  geocoding: ^5.0.1

  signalr_netcore: ^1.4.4
  provider: ^6.1.5+1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/branding/app_icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  background_color_ios: "#101A17"

flutter:
  uses-material-design: true

  assets:
    - assets/branding/app_icon.png
    - assets/branding/splash_screen.png
    - assets/branding/checkrix_logo.png

flutter_native_splash:
  color: "#101A17"
  image: assets/branding/app_icon.png

  android: true
  ios: true
  web: false

  android_gravity: center
  ios_content_mode: scaleAspectFit

  android_12:
    color: "#101A17"
    image: assets/branding/app_icon.png
    icon_background_color: "#101A17"